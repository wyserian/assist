# assist configuration example.
# Only sections assist reads are accepted; unknown keys are errors, so typos never pass
# silently.

config_version = 1

[apps]
firefox  = { windows = "firefox.exe", linux = "firefox", android = "org.mozilla.firefox" }
code     = { windows = "code.cmd", linux = "code" }
terminal = { windows = "wt.exe", linux = "x-terminal-emulator" }
notepad  = { windows = "notepad.exe", linux = "gedit" }

[scripts]
backup = { windows = "C:/scripts/backup.ps1", linux = "~/scripts/backup.sh" }
build  = { run = "cargo build", lane = "background" }

# Saved pipes, run by name ("run errors"). retry runs a failed pipe again; on_error is a
# pipe, or another saved pipe's name, to run when the last try failed; if runs it only when
# a condition over facts holds (assist facts lists them), e.g. if = "node.charging".
[pipes]
errors = { run = "run build | filter error | save build-errors.txt", retry = 1 }

# Schedules and triggers start saved pipes marked unattended = true, which may not need any
# confirmation (nobody is there to give it). Examples, off by default:
#
# [[schedules]]
# run = "errors"
# at = "07:30 mon-fri"           # or every = "1h"; missed = "run" runs once after sleep
#
# [[triggers]]
# run = "errors"
# on = "node.battery < 20"       # fires when the condition turns true
#
# [[triggers]]
# run = "errors"
# watch = "~/Downloads"          # fires when something in the folder changes

[contacts]
mom = "+910000000000"
dad = "+910000000001"

[commands.send_sms]
ask.text = "What should the message say?"   # overrides the phrase file's question
risky = true

[lanes]
interactive = 2
background = 3

[jobs]
timeout = "10m"
output_tail_kb = 64
retention_days = 7
log_cap_mb = 500

[search]
url = "https://duckduckgo.com/?q={query}"

# Overrides of the default policy table (PLAN.md section 3.6). Dotted capability names need quotes.
[policy]
shell = { owner_remote = "deny" }

# Who the assistant is and how it addresses you ("" for not at all).
[persona]
name = "Bee"
address = "Prime"
wake_word = ""          # "" for "hey Bee" / "okay Bee"; e.g. "bumblebee" if Bee wakes by mistake

# Voice input. After assist enroll, a spoken "yes" confirms only when the voice is at least
# this close (0 to 1) to your voiceprint; raise it if others get through, lower it if you don't.
[voice]
speaker_threshold = 0.35

# Reword any reply; keys and defaults are in config/phrases/en/replies.toml.
[replies]
not_understood = "Sorry {address}, please say that again."
