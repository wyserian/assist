# Matcher test cases, run against config/config.example.toml and the default English phrases.
# A case without `command` must match nothing.

# open / close apps
[[case]]
text = "open firefox"
command = "open_app"
slots = { app = "firefox" }

[[case]]
text = "Launch Firefox!"
command = "open_app"
slots = { app = "firefox" }

[[case]]
text = "start the terminal app"
command = "open_app"
slots = { app = "terminal" }

[[case]]
text = "bring up notepad"
command = "open_app"
slots = { app = "notepad" }

[[case]]
text = "open firfox"
command = "open_app"
slots = { app = "firefox" }

[[case]]
text = "close firefox"
command = "close_app"
slots = { app = "firefox" }

[[case]]
text = "quit the terminal"
command = "close_app"
slots = { app = "terminal" }

