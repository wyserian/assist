# What the assistant says. {name} and {address} come from [persona] in config.toml; when a
# value is empty, the space or comma before it goes too ("Sorry, please say that again.").
# Override any line in config.toml under [replies]. What a command says when it starts or
# asks to confirm is in its phrase file (`reply`, `confirm`).

greeting = "Hello {address}. {name} is listening."
wake = "Yes, {address}?"
not_understood = "Sorry {address}, please say that again."
offer_shell = "I don't know that command. Run \"{text}\" in the shell?"
expired = "That question expired."
cancelled = "Cancelled."
nothing_to_cancel = "Nothing to cancel."
empty_shell = "Type a command after $."
unavailable = "I can't do that on this device."
not_allowed = "I can't do that from {source}."
confirm = "{action}?"
started = "Okay."
say_number = "Please say a number."
unknown_choice = "I don't know \"{text}\". Try again, or say cancel."
declined = "Okay, I won't."
yes_or_no = "Please answer yes or no."
unclear_correction = "I couldn't tell what \"{text}\" should replace."
did_you_mean = "Did you mean {options}?"
other_owner = "This conversation belongs to {source}."
