# Open and close configured apps ([apps] in config.toml).

[open_app]
slots = { app = "list:apps" }
reply = "Opening {app}."
phrases = [
    "(open|launch|start) (the)? .app. (app)?",
    "bring up .app.",
]

[close_app]
slots = { app = "list:apps" }
reply = "Closing {app}."
phrases = ["(close|quit|exit) (the)? .app. (app)?"]
