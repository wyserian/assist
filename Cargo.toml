[workspace]
resolver = "2"
members = ["crates/assist-proto", "crates/assist-core", "crates/assist-actions", "crates/assist-server", "crates/assist-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/wyserian/assist"
publish = false

[workspace.dependencies]
assist-actions = { path = "crates/assist-actions" }
axum = { version = "0.8", features = ["ws"] }
anyhow = "1"
assist-server = { path = "crates/assist-server" }
assist-core = { path = "crates/assist-core" }
assist-proto = { path = "crates/assist-proto" }
clap = { version = "4", features = ["derive"] }
directories = "6"
futures-util = "0.3"
getrandom = "0.4"
insta = "1"
keyring = "4"
open = "5"
process-wrap = { version = "10", default-features = false }
regex = "1"
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
strsim = "0.11"
thiserror = "2"
tokio = "1"
tokio-tungstenite = "0.30"
tokio-util = "0.7"
toml = "1"
toml_edit = "0.25"
uuid = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

# panic stays "unwind": an action panic never kills the daemon, and UniFFI needs unwinding.
[profile.release]
strip = true

# Shipped builds only (cargo-dist); slow to build, so not the default release profile.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1

[profile.android]
inherits = "dist"
opt-level = "s"

[profile.dev]
debug = "line-tables-only"

# Dependencies optimized in dev; our own code still compiles fast.
[profile.dev.package."*"]
opt-level = 2
