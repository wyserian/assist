[workspace]
resolver = "2"
members = ["crates/assist-proto", "crates/assist-core", "crates/assist-actions", "crates/assist-server", "crates/assist-cli", "crates/assist-voice", "crates/assist-ffi"]

[workspace.package]
version = "0.5.0"
edition = "2021"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/wyserian/assist"
publish = false

[workspace.dependencies]
# Members pick their actions; the desktop takes the defaults.
assist-actions = { path = "crates/assist-actions", default-features = false }
axum = { version = "0.8", features = ["ws"] }
anyhow = "1"
assist-server = { path = "crates/assist-server" }
assist-core = { path = "crates/assist-core" }
assist-proto = { path = "crates/assist-proto" }
assist-voice = { path = "crates/assist-voice" }
clap = { version = "4", features = ["derive"] }
cpal = "0.18"
directories = "6"
futures-util = "0.3"
getrandom = "0.4"
insta = "1"
jiff = "1"
keyring = "4"
notify = "9"
# OCR on the phone (assist-actions feature `ocr`): pure Rust, models downloaded with consent.
ocrs = "0.14"
rten = "0.28"
image = { version = "0.25", default-features = false, features = ["png"] }
notify-rust = "4.19"
open = "5"
process-wrap = { version = "11", default-features = false }
regex = "1"
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sherpa-onnx = "2.0.3"
sha2 = "0.11"
strsim = "0.11"
# Unpacks voice model archives; pure-Rust bzip2 by default.
bzip2 = "0.6"
tar = { version = "0.4", default-features = false }
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
thiserror = "2"
tokio = "1"
tokio-tungstenite = "0.30"
tokio-util = "0.7"
uniffi = "0.32"
toml = "1"
toml_edit = "0.25"
uuid = "1"
windows = "0.62"
xcap = "0.9"

[workspace.lints.rust]
# deny, not forbid, so audited modules may opt out: the Win32 fact reader and process
# suspender in assist-actions (facts_win32.rs, processes_win32.rs). Every other `unsafe`
# fails the build.
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

# panic stays "unwind": an action panic never kills the daemon, and UniFFI needs unwinding.
[profile.release]
strip = true

# Shipped builds only (cargo-dist); slow to build, so not the default release profile.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1

[profile.android]
inherits = "dist"
opt-level = "s"

[profile.dev]
debug = "line-tables-only"

# Dependencies optimized in dev; our own code still compiles fast.
[profile.dev.package."*"]
opt-level = 2
