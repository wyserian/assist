# cargo-deny: licenses, security advisories, banned/duplicate crates, sources.
# No GPL in any binary (CLAUDE.md): only permissive licenses are allowed.

[graph]
all-features = true

[advisories]
yanked = "deny"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9
# The list is for future deps too; don't warn while a license is not used yet.
unused-allowed-license = "allow"

# MPL-2.0 is file-level copyleft (only changes to its own files must be shared), not GPL.
# Allowed per crate so every new MPL dependency still gets a review.
[[licenses.exceptions]]
crate = "option-ext" # via directories -> dirs-sys
allow = ["MPL-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
