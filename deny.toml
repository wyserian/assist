# cargo-deny: licenses, security advisories, banned/duplicate crates, sources.
# No GPL in any binary (CLAUDE.md): only permissive licenses are allowed.

[graph]
all-features = true

[advisories]
yanked = "deny"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9
# The list is for future deps too; don't warn while a license is not used yet.
unused-allowed-license = "allow"

# MPL-2.0 is file-level copyleft (only changes to its own files must be shared), not GPL.
# Allowed per crate so every new MPL dependency still gets a review.
[[licenses.exceptions]]
crate = "option-ext" # via directories -> dirs-sys
allow = ["MPL-2.0"]

# UniFFI (assist-ffi, Phase 4): the Kotlin bindings for the Android app, approved by the owner.
[[licenses.exceptions]]
crate = "uniffi"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "uniffi_bindgen"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "uniffi_core"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "uniffi_internal_macros"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "uniffi_macros"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "uniffi_meta"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "uniffi_pipeline"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "uniffi_udl"
allow = ["MPL-2.0"]

# notify (folder triggers, Phase 3) and its hash crate: public domain and Boost, both
# permissive, approved by the owner with notify.
[[licenses.exceptions]]
crate = "notify"
allow = ["CC0-1.0"]

[[licenses.exceptions]]
crate = "xxhash-rust" # via notify
allow = ["BSL-1.0"]

# Build-time only: sherpa-onnx-sys's build script downloads and unpacks its prebuilt library.
# All three are permissive; none is linked into a binary.
[[licenses.exceptions]]
crate = "libbz2-rs-sys" # bzip2 decompression
allow = ["bzip2-1.0.6"]

[[licenses.exceptions]]
crate = "ppmd-rust" # via zip
allow = ["CC0-1.0", "MIT-0"]

[[licenses.exceptions]]
crate = "webpki-roots" # Mozilla CA roots for the download's TLS
allow = ["CDLA-Permissive-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
