# Voice engine spike (PLAN.md Phase 2): not part of the workspace, not built by CI.
[package]
name = "voice-spike"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
anyhow = "1"
assist-core = { path = "../../crates/assist-core" }
cpal = "0.18"
serde = { version = "1", features = ["derive"] }
sherpa-onnx = "2.0.3"
symphonia = { version = "0.5", default-features = false, features = ["mp3"] }
toml = "1"
vosk = "0.3.1"
