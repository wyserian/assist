name: ci

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: CI never writes to the repo.
permissions:
  contents: read

# Third-party actions are pinned to commit SHAs (tag in the comment) so a moved tag cannot
# change what runs.
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@893d6ee8d714b6c7dfe2bcd94e5759e9a7958a7e # v2.90.10
        with:
          tool: just,cargo-nextest
      # cpal (assist-voice) links ALSA on Linux.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      # sherpa-onnx (assist-voice) links a prebuilt library. Its build script downloads it
      # unverified into target/, which the cache prunes while keeping the build script's
      # result, so linking fails on a cache hit. Fetch it here with a pinned checksum, outside
      # target/, every run. Keep the version in step with sherpa-onnx-sys in Cargo.lock.
      - name: sherpa-onnx library
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) name=linux-x64-static; sum=f927e695d29b8c7ea3fda97eed215204b210fd57f9faf990a93377bac098ad57 ;;
            Windows) name=win-x64-static-MT-Release; sum=2dfaeacf899e8d21584caab54a55933b481b5dccbb3615e92daecc6f0618e781 ;;
          esac
          file="sherpa-onnx-v2.0.3-$name-lib.tar.bz2"
          cd "$RUNNER_TEMP"
          curl --fail --location --silent --show-error --proto =https --output "$file" \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.3/$file"
          echo "$sum  $file" | sha256sum --check
          tar --force-local -xjf "$file"
          echo "SHERPA_ONNX_LIB_DIR=$RUNNER_TEMP/${file%.tar.bz2}/lib" >> "$GITHUB_ENV"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo clippy -p assist-actions --no-default-features -- -D warnings
      - run: just test

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@81891abc19297b21343b15ef67dc61e4aea74fda # v2.1.4
