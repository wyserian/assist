[package]
name = "assist-actions"
description = "Built-in assist actions, one Cargo feature each."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["shell", "scripts", "apps", "search", "transforms", "facts", "rename", "screen", "record", "processes", "mute", "memory"]
shell = ["dep:process-wrap", "dep:tokio"]
scripts = ["shell", "dep:toml"]
apps = ["dep:open", "dep:tokio", "dep:toml"]
search = ["dep:open", "dep:tokio"]
transforms = ["dep:regex", "dep:tokio"]
facts = ["dep:windows"]
rename = ["dep:serde", "dep:serde_json", "dep:tokio"]
screen = ["dep:xcap", "dep:windows", "dep:tokio"]
record = ["shell"]
# Off by default: it links the speech models (sherpa-onnx); assist-cli turns it on with voice.
transcribe = ["shell", "dep:assist-voice"]
processes = ["dep:sysinfo", "dep:windows"]
mute = ["dep:tokio"]
memory = ["dep:tokio"]

[dependencies]
assist-core.workspace = true
assist-voice = { workspace = true, optional = true }
open = { workspace = true, optional = true }
regex = { workspace = true, optional = true }
directories.workspace = true
sysinfo = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["fs", "io-util", "macros", "process", "rt"] }
toml = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
# Screen capture; Windows only until Linux gets OCR (xcap needs PipeWire and XCB there).
xcap = { workspace = true, optional = true }
windows = { workspace = true, optional = true, features = [
    "Foundation_Collections",
    "Graphics_Imaging",
    "Media_Ocr",
    "Security_Cryptography",
    "Storage",
    "Storage_Streams",
    "System_Power",
    "Win32_Foundation",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
process-wrap = { workspace = true, optional = true, features = ["tokio1", "job-object", "kill-on-drop"] }

[target.'cfg(unix)'.dependencies]
process-wrap = { workspace = true, optional = true, features = ["tokio1", "process-group", "kill-on-drop"] }

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt", "time"] }
tokio-util.workspace = true

[lints]
workspace = true
