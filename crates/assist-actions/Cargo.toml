[package]
name = "assist-actions"
description = "Built-in assist actions, one Cargo feature each."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["shell", "scripts", "apps", "search", "transforms", "facts"]
shell = ["dep:process-wrap", "dep:tokio"]
scripts = ["shell", "dep:toml"]
apps = ["dep:open", "dep:tokio", "dep:toml"]
search = ["dep:open", "dep:tokio"]
transforms = ["dep:regex", "dep:tokio"]
facts = ["dep:windows"]

[dependencies]
assist-core.workspace = true
open = { workspace = true, optional = true }
regex = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["fs", "io-util", "macros", "process", "rt"] }
toml = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, optional = true, features = [
    "System_Power",
    "Win32_Foundation",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
process-wrap = { workspace = true, optional = true, features = ["tokio1", "job-object", "kill-on-drop"] }

[target.'cfg(unix)'.dependencies]
process-wrap = { workspace = true, optional = true, features = ["tokio1", "process-group", "kill-on-drop"] }

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt", "time"] }
tokio-util.workspace = true

[lints]
workspace = true
