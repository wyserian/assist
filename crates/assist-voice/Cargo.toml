[package]
name = "assist-voice"
description = "Voice input for assist: microphone capture, voice activity detection, utterance segmentation."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
assist-core.workspace = true
sherpa-onnx.workspace = true
thiserror.workspace = true

# Android captures the microphone and speaks in the app (Kotlin) and feeds the audio in.
[target.'cfg(not(target_os = "android"))'.dependencies]
cpal.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Foundation", "Media_Core", "Media_Playback", "Media_SpeechSynthesis", "Storage_Streams"] }

[dev-dependencies]
anyhow.workspace = true

[lints]
workspace = true
