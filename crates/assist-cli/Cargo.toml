[package]
name = "assist-cli"
description = "The assist binary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "assist"
path = "src/main.rs"

[features]
default = ["voice"]
# assist listen: microphone, speech to text, spoken replies.
voice = ["dep:assist-voice", "dep:sha2", "assist-actions/transcribe"]

[dependencies]
anyhow.workspace = true
assist-actions.workspace = true
assist-core.workspace = true
assist-proto.workspace = true
assist-server.workspace = true
assist-voice = { workspace = true, optional = true }
clap.workspace = true
directories.workspace = true
jiff.workspace = true
notify.workspace = true
notify-rust.workspace = true
futures-util.workspace = true
keyring.workspace = true
open.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = { workspace = true, optional = true }
tokio = { workspace = true, features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite.workspace = true

[lints]
workspace = true
